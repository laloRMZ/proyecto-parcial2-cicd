name: CI/CD Pipeline - Proyecto Parcial 2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run pytest suite
        run: pytest -v tests/backend

  test-frontend-e2e:
    name: Frontend & E2E Tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright dependencies
        working-directory: tests/e2e
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        working-directory: tests/e2e
        run: npx playwright test

  notify-openobserve-ci:
    name: Report CI Results to OpenObserve
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend-e2e]
    if: always()
    steps:
      - name: Send CI test result to OpenObserve
        env:
          OPENOBSERVE_URL: ${{ secrets.OPENOBSERVE_URL }}
          OPENOBSERVE_TOKEN: ${{ secrets.OPENOBSERVE_TOKEN }}
          BACKEND_RESULT: ${{ needs.test-backend.result }}
          E2E_RESULT: ${{ needs.test-frontend-e2e.result }}
        run: |
          if [ -z "$OPENOBSERVE_URL" ] || [ -z "$OPENOBSERVE_TOKEN" ]; then
            echo "OPENOBSERVE_URL or OPENOBSERVE_TOKEN secret not set; skipping telemetry report."
            exit 0
          fi

          OVERALL_STATUS="success"
          if [ "$BACKEND_RESULT" != "success" ] || [ "$E2E_RESULT" != "success" ]; then
            OVERALL_STATUS="failure"
          fi

          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          PAYLOAD=$(cat <<EOF
          [{
            "event_type": "ci_test_run",
            "status": "$OVERALL_STATUS",
            "backend_result": "$BACKEND_RESULT",
            "e2e_result": "$E2E_RESULT",
            "commit": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "actor": "${{ github.actor }}",
            "repository": "${{ github.repository }}",
            "timestamp": "$TIMESTAMP"
          }]
          EOF
          )

          curl --fail --silent --show-error \
            -X POST "${OPENOBSERVE_URL%/}/api/default/ci_cd_events/_json" \
            -H "Authorization: Basic ${OPENOBSERVE_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

  deploy-ec2:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend-e2e]
    if: github.ref == 'refs/heads/main' && success()
    steps:
      - name: Deploy containers via SSH to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
        run: |
          mkdir -p ~/.ssh
          if echo "$EC2_SSH_KEY" | grep -q "BEGIN "; then
            printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/ec2_key
          else
            printf '%s' "$EC2_SSH_KEY" | tr -d ' \r\n' | base64 -d > ~/.ssh/ec2_key
          fi
          chmod 600 ~/.ssh/ec2_key
          APP_DIR="${EC2_APP_DIR:-~/proyecto-parcial2-cicd}"
          ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=no "${EC2_USER}@${EC2_HOST}" "
            cd ${APP_DIR} &&
            git fetch origin main &&
            git reset --hard origin/main &&
            docker compose up -d --build &&
            docker compose ps
          "

      - name: Report Deploy Event to OpenObserve
        if: always()
        env:
          OPENOBSERVE_URL: ${{ secrets.OPENOBSERVE_URL }}
          OPENOBSERVE_TOKEN: ${{ secrets.OPENOBSERVE_TOKEN }}
          DEPLOY_STATUS: ${{ job.status }}
        run: |
          if [ -z "$OPENOBSERVE_URL" ] || [ -z "$OPENOBSERVE_TOKEN" ]; then
            echo "OPENOBSERVE_URL or OPENOBSERVE_TOKEN secret not set; skipping deploy report."
            exit 0
          fi

          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          PAYLOAD=$(cat <<EOF
          [{
            "event_type": "ec2_deploy",
            "status": "$DEPLOY_STATUS",
            "commit": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "actor": "${{ github.actor }}",
            "repository": "${{ github.repository }}",
            "timestamp": "$TIMESTAMP"
          }]
          EOF
          )

          curl --fail --silent --show-error \
            -X POST "${OPENOBSERVE_URL%/}/api/default/ci_cd_events/_json" \
            -H "Authorization: Basic ${OPENOBSERVE_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
